# Isolated development/test databases; never reuse the normal Compose volumes or ports.
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:${ROOTLENS_TEST_NEO4J_HTTP_PORT:-57474}:7474"
      - "127.0.0.1:${ROOTLENS_TEST_NEO4J_BOLT_PORT:-57687}:7687"
    environment:
      NEO4J_AUTH: neo4j/rootlens-test-only
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - test_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p rootlens-test-only 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:${ROOTLENS_TEST_POSTGRES_PORT:-55433}:5432"
    environment:
      POSTGRES_DB: rootlens_test
      POSTGRES_USER: rootlens_test
      POSTGRES_PASSWORD: rootlens-test-only
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootlens_test -d rootlens_test"]
      interval: 5s
      timeout: 5s
      retries: 24
volumes:
  test_neo4j_data:
  test_postgres_data:
